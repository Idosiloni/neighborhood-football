    <style>
      /* Before the app starts: a ball rolling on a chalk line (the app's own is src/components/Loading.jsx). */
      body { margin: 0; background: #f3f6f3; }
      .splash { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; }
      .splash-track { position: relative; width: 150px; height: 44px; border-bottom: 3px solid rgb(17 36 26 / 0.22); }
      .splash-track svg { position: absolute; bottom: 2px; left: calc(50% - 17px); animation: splash-roll 1.6s cubic-bezier(0.45, 0, 0.55, 1) infinite; filter: drop-shadow(0 2px 2px rgb(17 36 26 / 0.25)); }
      @keyframes splash-roll { 0%, 100% { transform: translateX(-56px) rotate(-180deg); } 50% { transform: translateX(56px) rotate(180deg); } }
      @media (prefers-reduced-motion: reduce) { .splash-track svg { animation: none; } }
    </style>
    <title>כדורגל שכונה</title>
  </head>
